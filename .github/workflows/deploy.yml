name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/public_html &&
            eval "$(ssh-agent -s)" && ssh-add ~/.ssh/github/id_ed25519 &&
            git fetch origin main &&
            git reset --hard origin/main
          '

      - name: Install Python dependencies
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/public_html/backend
            python=/home/${{ secrets.SSH_USER }}/virtualenv/public_html/backend/3.14/bin/python
            $python -m pip install --upgrade pip
            $python -m pip install -r requirements-prod.txt
          '

      - name: Apply fresh migrations
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/virtualenv/public_html/backend/3.14
            ENVIRONMENT=production bin/python ../../../../public_html/backend/manage.py migrate --noinput
          '

      - name: Restart backend (cPanel)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/public_html/backend &&
            mkdir -p tmp &&
            touch tmp/restart.txt &&
            echo "Passenger restart requested"
          '

      - name: Upload frontend build
        run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist .
          scp -o StrictHostKeyChecking=no frontend-dist.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/frontend-dist.tar.gz
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            rm -rf /home/${{ secrets.SSH_USER }}/public_html/frontend/dist &&
            mkdir -p /home/${{ secrets.SSH_USER }}/public_html/frontend/dist &&
            tar -xzf /tmp/frontend-dist.tar.gz -C /home/${{ secrets.SSH_USER }}/public_html/frontend/dist &&
            rm /tmp/frontend-dist.tar.gz &&
            echo "Frontend uploaded: $(ls /home/${{ secrets.SSH_USER }}/public_html/frontend/dist | wc -l) files"
          '