name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_DATABASE: arweal
          MARIADB_USER: arweal
          MARIADB_PASSWORD: arweal
          MARIADB_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx vitest run

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Grant test database privileges
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword -e \
            "GRANT ALL PRIVILEGES ON \`test_arweal\`.* TO 'arweal'@'%'; FLUSH PRIVILEGES;"

      - name: Backend tests
        working-directory: backend
        env:
          DB_NAME: arweal
          DB_USER: arweal
          DB_PASSWORD: arweal
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DJANGO_SECRET_KEY: test-secret-key
        run: |
          python manage.py test --noinput

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
              set -e

              cd /home/${{ secrets.SSH_USER }}/public_html

              GIT_SSH_COMMAND="ssh -i ~/.ssh/github/id_ed25519 -o IdentitiesOnly=yes" \
                git fetch origin main

              git reset --hard origin/main
            '

      - name: Install Python dependencies
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/public_html/backend
            python=/home/${{ secrets.SSH_USER }}/virtualenv/public_html/backend/3.14/bin/python
            $python -m pip install --upgrade pip
            $python -m pip install -r requirements-prod.txt
          '

      - name: Apply fresh migrations
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/virtualenv/public_html/backend/3.14
            ENVIRONMENT=production bin/python ../../../../public_html/backend/manage.py migrate --noinput
          '

      - name: Restart backend (cPanel)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /home/${{ secrets.SSH_USER }}/public_html/backend &&
            mkdir -p tmp &&
            touch tmp/restart.txt &&
            echo "Passenger restart requested"
          '

      - name: Upload frontend build
        run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist .
          scp -o StrictHostKeyChecking=no frontend-dist.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/frontend-dist.tar.gz
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            rm -rf /home/${{ secrets.SSH_USER }}/public_html/frontend/dist &&
            mkdir -p /home/${{ secrets.SSH_USER }}/public_html/frontend/dist &&
            tar -xzf /tmp/frontend-dist.tar.gz -C /home/${{ secrets.SSH_USER }}/public_html/frontend/dist &&
            rm /tmp/frontend-dist.tar.gz &&
            echo "Frontend uploaded: $(ls /home/${{ secrets.SSH_USER }}/public_html/frontend/dist | wc -l) files"
          '